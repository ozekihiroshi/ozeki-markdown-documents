name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked
      - name: PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  browser-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build:assets
      - name: Generated assets are current
        run: git diff --exit-code -- assets

  release-and-integration:
    runs-on: ubuntu-latest
    needs: [quality, browser-assets]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: ./build-release.sh
      - run: tests/ci/run-wordpress-integration.sh 8.2 7.1 build/ozeki-markdown-documents-0.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ozeki-markdown-documents-0.1.0
          path: build/ozeki-markdown-documents-0.1.0.zip
          if-no-files-found: error
